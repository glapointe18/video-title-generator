<script>
const form = document.getElementById('titleForm');
const addTitleBtn = document.getElementById('addTitleBtn');
const titlesContainer = document.getElementById('titlesContainer');
const colorPaletteDiv = document.getElementById('colorPalette');
const customColorInput = document.getElementById('customColor');

const paletteColors = ['#fff2cc', '#ffb1b7', '#7c67ff', '#ffffff', '#ff7456'];
let selectedColor = '#ffffff';

// Générer les pastilles de couleur
paletteColors.forEach(color => {
  const swatch = document.createElement('div');
  swatch.className = 'colorSwatch';
  swatch.style.background = color;
  swatch.dataset.color = color;
  if(color === '#ffffff') swatch.classList.add('selected');
  colorPaletteDiv.insertBefore(swatch, customColorInput);
});

const colorSwatches = document.querySelectorAll('.colorSwatch');
colorSwatches.forEach(swatch => {
  swatch.addEventListener('click', () => {
    colorSwatches.forEach(s => s.classList.remove('selected'));
    swatch.classList.add('selected');
    selectedColor = swatch.dataset.color;
  });
});

customColorInput.addEventListener('change', () => {
  colorSwatches.forEach(s => s.classList.remove('selected'));
  selectedColor = customColorInput.value;
});

// Ajouter un nouveau bloc de titre
addTitleBtn.addEventListener('click', () => {
  const newBlock = document.createElement('div');
  newBlock.className = 'titleBlock';
  newBlock.innerHTML = `
    <label>Titre :</label><input type="text" class="videoTitle" placeholder="Ex: Sonate n°5">
    <label>Opera / Source :</label><input type="text" class="operaSource" placeholder="Ex: La Traviata">
    <label>Compositeur :</label><input type="text" class="composer" placeholder="Ex: Beethoven">
  `;
  titlesContainer.appendChild(newBlock);
});

// Générer et télécharger le CSV à la soumission
form.addEventListener('submit', (e) => {
  e.preventDefault();

  const interpreter = document.getElementById('interpreter').value.trim();
  if(!interpreter) return;

  const instrumentTessiture = document.getElementById('instrumentTessiture').value;
  const accompanist = document.getElementById('accompanist').value;
  const instrumentAccomp = document.getElementById('instrumentAccomp').value;
  const fontChoice = document.getElementById('fontChoice').value;
  const fontStyle = document.getElementById('fontStyle').value;

  // Création de l'en-tête du fichier CSV
  let csvContent = "Interprète,Instrument/Tessiture,Accompagnateur,Instrument Accompagnateur,Couleur,Police,Style,Titre,Opera/Source,Compositeur\n";

  const titleBlocks = titlesContainer.querySelectorAll('.titleBlock');

  titleBlocks.forEach((block) => {
    const videoTitle = block.querySelector('.videoTitle').value.trim();
    const operaSource = block.querySelector('.operaSource').value.trim();
    const composer = block.querySelector('.composer').value.trim();
    
    // Ignorer les blocs où le titre est vide
    if(!videoTitle) return;

    // Fonction pour échapper les virgules et guillemets pour éviter de casser le CSV
    const escapeCSV = (str) => `"${str.replace(/"/g, '""')}"`;

    // Assembler la ligne
    const row = [
      interpreter, instrumentTessiture, accompanist, instrumentAccomp, 
      selectedColor, fontChoice, fontStyle, 
      videoTitle, operaSource, composer
    ].map(escapeCSV).join(',');

    csvContent += row + "\n";
  });

  // Ajouter le BOM (Byte Order Mark) pour qu'Excel lise correctement les accents (UTF-8)
  const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csvContent], { type: 'text/csv;charset=utf-8;' });
  
  // Créer un lien de téléchargement invisible et cliquer dessus
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.setAttribute('href', url);
  
  // Nom du fichier personnalisé avec le nom de l'interprète
  const safeName = interpreter.replace(/[\\\/:*?"<>|]/g, '');
  link.setAttribute('download', `${safeName}_titres.csv`);
  
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
});
</script>
